<!DOCTYPE html>
<!--Tells the browser that this is an HTML5 document-->
<html lang="en">
<!-- Tells the browser and readers that this page is in english -->
<head>
<!--the head section holds information about the page-->
    <meta charset="UTF-8">
    <!-- makes letters and symbols display correctly -->
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- the meta tag makes the page fit phone screens -->
    <title>Films That Stayed With Me</title>
    <!-- Sets the title of the page that appears in the browser tab -->
</head>
<body>
<!--holds the content of the page, everything visible such as text, images, and links-->
<header>
<!--the header is the top section of the page-->
    <h1>Films That Stayed With Me</h1>
    <!-- the h1 tag is a heading, the largest and most important heading -->
<p>Five film recommendations that left a lasting impression:</p>
<!-- the p tag is a paragraph -->
</header>
</body
</html>
